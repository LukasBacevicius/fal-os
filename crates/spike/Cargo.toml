[package]
name = "falos-spike"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "falos-spike"
path = "src/main.rs"

[dependencies]
falos-engine = { path = "../engine" }
wgpu.workspace = true
winit.workspace = true
log.workspace = true
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location", "console", "RequestInit", "Response"] }
console_error_panic_hook = "0.1"
console_log = "1"
js-sys = "0.3"
