[package]
name = "falos-client"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
falos-doc = { path = "../doc" }
falos-engine = { path = "../engine" }
falos-figma = { path = "../figma" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log.workspace = true
web-time.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu.workspace = true
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlVideoElement",
  "HtmlMediaElement", "Node", "Blob", "File", "Url", "ImageBitmap", "Response", "console",
  "Performance", "CssStyleDeclaration",
] }
