[package]
name = "falos-host"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
falos-doc = { path = "../doc" }
rmcp = { version = "3.5", features = ["server", "macros", "transport-streamable-http-server"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
schemars = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rand = "0.9"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
# Asset ops: in-process image decode/encode + Lanczos resize, lossy WebP, zip packages.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
fast_image_resize = { version = "5", features = ["image"] }
webp = { version = "0.3", default-features = false }
zip = { version = "2", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
rmcp = { version = "3.5", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3"
tokio-tungstenite = "0.29"
futures = "0.3"
