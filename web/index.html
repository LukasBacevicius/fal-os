<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fal-os spike</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #121214; }
    canvas { display: block; width: 100vw !important; height: 100vh !important; outline: none; touch-action: none; }
    #stats { position: fixed; left: 12px; bottom: 12px; font: 12px/1.4 ui-monospace, monospace; color: #ddd;
             background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; pointer-events: none; max-width: calc(100vw - 48px); }
    #nogpu { display: none; color: #f88; font: 14px system-ui; padding: 24px; }
  </style>
</head>
<body>
  <div id="nogpu">WebGPU is not available in this browser.</div>
  <div id="stats">loading…</div>
  <script type="module">
    if (!navigator.gpu) document.getElementById('nogpu').style.display = 'block';
    import init from './pkg/falos_spike.js';
    init();
  </script>
</body>
</html>
