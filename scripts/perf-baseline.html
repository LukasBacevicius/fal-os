<!doctype html><meta charset=utf-8><body style="margin:0;background:#000"><canvas id=c style="width:100vw;height:100vh;display:block"></canvas><script type=module>
const post=(o)=>fetch('http://127.0.0.1:7599/',{method:'POST',body:JSON.stringify(o)});
async function rate(ms,frame){const ft=[];let last=performance.now();let run=true;await new Promise(res=>{const f=t=>{ft.push(t-last);last=t;frame&&frame();if(performance.now()-ft.t0<ms)requestAnimationFrame(f);else res()};ft.t0=performance.now();requestAnimationFrame(f)});ft.shift();ft.sort((a,b)=>a-b);return {p50:+ft[ft.length>>1].toFixed(1),p90:+ft[Math.floor(ft.length*.9)].toFixed(1),n:ft.length}}
await new Promise(r=>setTimeout(r,1500));
const out={dpr:devicePixelRatio,w:innerWidth,h:innerHeight,vis:document.visibilityState,focus:document.hasFocus()};
out.blank=await rate(2000);
const c=document.getElementById('c');c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;
const a=await navigator.gpu.requestAdapter();const d=await a.requestDevice();
for(const [fmt,alpha] of [[navigator.gpu.getPreferredCanvasFormat(),'opaque'],['rgba8unorm','premultiplied'],['bgra8unorm','premultiplied']]){
  const ctx=c.getContext('webgpu');ctx.configure({device:d,format:fmt,alphaMode:alpha});
  out[fmt+'/'+alpha]=await rate(2000,()=>{const e=d.createCommandEncoder();const p=e.beginRenderPass({colorAttachments:[{view:ctx.getCurrentTexture().createView(),loadOp:'clear',clearValue:{r:0,g:0,b:Math.random()*0.2,a:1},storeOp:'store'}]});p.end();d.queue.submit([e.finish()])});
}
out.preferred=navigator.gpu.getPreferredCanvasFormat();
post({probe:'base',...out});
</script>
