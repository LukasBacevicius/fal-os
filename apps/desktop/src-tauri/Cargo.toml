[package]
name = "falos-desktop"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

# Own workspace: keeps Tauri's dependency tree out of the root workspace and lockfile.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# "open at login" (Setup, tray): a LaunchAgent that starts the app hidden (`--hidden`).
tauri-plugin-autostart = "2"
# drag-rs: native drag of file URLs out of the window (docs/ASSETS-V1.md §4).
drag = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
libc = "0.2"
# Run-done / needs-you notifications with click-through (UNUserNotificationCenter).
objc2-user-notifications = "0.3"
block2 = "0.6"
# Only to find (attributes, no prompt) and migrate a fal key an older build kept in the Keychain;
# the key itself lives in $FALOS_HOME/fal.env (docs/PACKAGING.md §2.4).
security-framework = "3"

[features]
# `cargo build --features custom-protocol` (what `cargo tauri build` does) serves
# frontendDist from the app bundle instead of loading devUrl.
custom-protocol = ["tauri/custom-protocol"]
