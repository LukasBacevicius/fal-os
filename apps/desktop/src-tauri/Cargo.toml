[package]
name = "falos-desktop"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

# Own workspace: keeps Tauri's dependency tree out of the root workspace and lockfile.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[features]
# `cargo build --features custom-protocol` (what `cargo tauri build` does) serves
# frontendDist from the app bundle instead of loading devUrl.
custom-protocol = ["tauri/custom-protocol"]
